<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="../assets/favicon-32x32.png"
        />

        <title>Frontend Mentor | Space tourism website</title>

        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bellefair&display=swap"
            rel="stylesheet"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="../css/styles.css" />
        <link rel="stylesheet" href="../css/crew.css" />

        <script defer src="../js/script.js"></script>
    </head>

    <body>
        <div class="bg-img bg-img--crew">
            <header class="header">
                <img
                    src="../assets/shared/logo.svg"
                    alt="Space tourism logo: a dark four-point star centered in a white circle."
                    class="logo"
                />

                <nav class="main-nav">
                    <ul>
                        <li>
                            <a href="../index.html"><span>00</span> Home</a>
                        </li>
                        <li>
                            <a href="destination.html"
                                ><span>01</span> Destination</a
                            >
                        </li>
                        <li>
                            <a href="#" class="selected" aria-current="page"
                                ><span>02</span> Crew</a
                            >
                        </li>
                        <li>
                            <a href="technology.html"
                                ><span>03</span> Technology</a
                            >
                        </li>
                    </ul>
                </nav>

                <button class="btn-mobile-nav">
                    <img
                        src="../assets/shared/icon-hamburger.svg"
                        alt="Three light-blue horizontal bars forming a menu icon."
                    />
                    <img
                        src="../assets/shared/icon-close.svg"
                        alt="Light blue X-shaped close icon formed by two crossing bars; a simple, neutral interface symbol with no text or wider scene."
                    />
                </button>
            </header>

            <main>
                <div class="crew grid">
                    <div>
                        <h1 class="crew-primary-heading">
                            <span>02</span> <span>Meet your crew</span>
                        </h1>

                        <div class="crew-member-info">
                            <h2 class="crew-member-name">
                                <span id="crew-member-role">Commander</span>
                                <span id="crew-member-name">Douglas Hurley</span>
                            </h2>

                            <p class="paragraph">
                                Douglas Gerald Hurley is an American engineer,
                                former Marine Corps pilot and former NASA
                                astronaut. He launched into space for the third
                                time as commander of Crew Dragon Demo-2.
                            </p>
                        </div>

                        <div class="tabs tabs--dots">
                            <div class="selected"></div>
                            <div></div>
                            <div></div>
                            <div></div>
                        </div>
                    </div>

                    <picture>
                        <source
                            id="crew-image-webp"
                            type="image/webp"
                            srcset="../assets/crew/image-douglas-hurley.webp"
                        />
                        <img
                            src="../assets/crew/image-douglas-hurley.png"
                            alt="Douglas Hurley, a smiling gray-haired astronaut in a blue flight suit, raises both fists in celebration against a plain green background. His suit bears NASA and DOUG HURLEY patches."
                            class="crew-member-photo"
                        />
                    </picture>
                </div>
            </main>
        </div>
    </body>
</html>
